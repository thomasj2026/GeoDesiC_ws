# Create an EKF to output a state estimate of orientation and altitude
ekf_filter_node:
  ros__parameters:
    use_sim_time: true

    frequency: 30.0
    publish_tf: false
    two_d_mode: false

    print_diagnostics: true
    debug: true
    debug_out_file: /tmp/ekf_debug.txt

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    imu0: /imu/data
    imu0_config: [
      false, false, false,
      true, true, true,
      false, false, false,
      true, true, true,
      false, false, false
    ]

    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: false