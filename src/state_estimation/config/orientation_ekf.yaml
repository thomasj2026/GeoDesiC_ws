# Create an EKF to output a state estimate of orientation and altitude
ekf_filter_node:
  ros__parameters:
    use_sim_time: true

    frequency: 50.0   # IMU publishes at 100Hz, thus every EKF estimate gets 2 IMU measurements
    publish_tf: true
    two_d_mode: false

    print_diagnostics: true
    debug: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    imu0: /imu/data_cov     # Use injected covariance imu topic
    imu0_config: [
      false, false, false,  # X, Y, Z
      true, true, true,     # Roll, Pitch, Yaw
      false, false, false,  # X_dot, Y_dot, Z_dot
      true, true, true,     # Roll_rate, Pitch_rate, Yaw_rate
      false, false, false   # X_ddot, Y_ddot, Z_ddot
    ]

    imu0_differential: false    # Converts pose measurements into relative velocity changes
    imu0_relative: false     # Relative or absolute measurement
    imu0_remove_gravitational_acceleration: false     # Keep grabity accelerometer value

    reset_on_time_jump: true